# ==============================================================================
# ESPHome Configuration for Cheap Yellow Display 2.8" (ESP32-2432S028R)
# Author: Tushar Aggarwal (tushar2704)
# Repository: https://github.com/tushar2704/Cheap-Yellow-Display-Community
# YouTube: @IamNotIntoTech | @Makerrdesigns
# ==============================================================================

esphome:
  name: cyd-28-smart-panel
  friendly_name: "CYD 2.8 Smart Panel"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant native API
api:
  encryption:
    key: "!secret api_encryption_key"

ota:
  - platform: esphome

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "CYD-Fallback-Hotspot"
    password: "fallback_password"

captive_portal:

# SPI Bus Configuration for Display & Touch
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# Backlight PWM Output
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 5000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "CYD Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON

# Ambient Light Sensor (LDR)
sensor:
  - platform: adc
    pin: GPIO34
    name: "CYD Ambient Light"
    update_interval: 10s
    unit_of_measurement: "%"
    filters:
      - multiply: 0.0244140625 # Map 0-4095 to 0-100%

# Onboard RGB LED (Active LOW)
output:
  - platform: gpio
    pin:
      number: GPIO4
      inverted: true
    id: led_red_gpio
  - platform: gpio
    pin:
      number: GPIO16
      inverted: true
    id: led_green_gpio
  - platform: gpio
    pin:
      number: GPIO17
      inverted: true
    id: led_blue_gpio

light:
  - platform: rgb
    name: "CYD Status LED"
    red: led_red_gpio
    green: led_green_gpio
    blue: led_blue_gpio

# Display Driver (ILI9341 320x240 Landscape)
display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin:
      ignore_strapping_warning: true
      number: GPIO-1 # Connected to EN
    rotation: 90
    dimensions:
      height: 240
      width: 320
    lambda: |-
      it.fill(Color::BLACK);
      it.printf(160, 40, id(font_title), TextAlign::CENTER, "CYD SMART PANEL");
      it.printf(160, 100, id(font_time), TextAlign::CENTER, "%s", id(ha_time).now().strftime("%H:%M").c_str());
      it.printf(160, 160, id(font_text), TextAlign::CENTER, "Home Assistant Connected");

# Touchscreen Controller (XPT2046 Resistive)
touchscreen:
  - platform: xpt2046
    spi_id: tft_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    calibration:
      x_min: 300
      x_max: 3800
      y_min: 200
      y_max: 3700
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true

# Time Synchronization via Home Assistant
time:
  - platform: homeassistant
    id: ha_time

# Fonts
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 20
  - file: "gfonts://Roboto"
    id: font_time
    size: 48
  - file: "gfonts://Roboto"
    id: font_text
    size: 14
