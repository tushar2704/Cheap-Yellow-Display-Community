[platformio]
src_dir = .

[env:esp32-2432S028C]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    fbiego/CST816S@^1.1.1
    bblanchon/ArduinoJson@^6.21.4

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D I2C_SDA_PIN=33
    -D I2C_SCL_PIN=32
    -D TOUCH_RST_PIN=25
    -D TOUCH_INT_PIN=21
