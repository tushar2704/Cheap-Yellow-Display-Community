name: CYD Firmware Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Projects with PlatformIO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Run Repository Verification Audit
        run: python3 tools/audit_repository.py

      - name: Build 01-Hello-CYD (Beginner)
        run: cd projects/beginner/01-hello-cyd && pio run

      - name: Build 01-Weather-Station (Intermediate)
        run: cd projects/intermediate/01-weather-station && pio run

      - name: Build 29-CYD-MultiTask-OS (Dual-Core FreeRTOS)
        run: cd projects/advanced/29-cyd-multitask-os && pio run

      - name: Build 30-Cross-Screen-Pong (CYD-to-CYD ESP-NOW)
        run: cd projects/advanced/30-cyd-to-cyd-cross-screen-pong && pio run

      - name: Build 01-CardFlow-Launcher (Capacitive CST816S)
        run: cd projects/capacitive/01-cardflow-gesture-launcher && pio run
